<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog & Tavsiyeler — Evlenmek İsteyenler</title>
<meta name="description" content="Evlilik öncesi tavsiyeler, ilk buluşma ipuçları, ciddi ilişki rehberi ve daha fazlası.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .blog-hero { padding: 60px 0 30px; text-align: center; background: linear-gradient(135deg, #fff5f9, #f5e8f5); }
  .blog-hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -.03em; margin-bottom: 12px; }
  .blog-hero p { color: var(--muted); max-width: 600px; margin: 0 auto; }
  .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding: 40px 0; }
  .blog-card { background: #fff; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-sm); transition: .25s; cursor: pointer; display: flex; flex-direction: column; }
  .blog-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
  .blog-card .cover { aspect-ratio: 16/9; background-size: cover; background-position: center; background: linear-gradient(135deg, var(--rose), var(--plum)); display: grid; place-items: center; color: #fff; font-size: 3rem; }
  .blog-card .body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
  .blog-card .cat { display: inline-block; padding: 3px 10px; border-radius: 8px; background: var(--rose-soft); color: var(--rose-dark); font-size: .72rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; align-self: flex-start; }
  .blog-card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; line-height: 1.3; }
  .blog-card p { color: var(--muted); font-size: .88rem; line-height: 1.6; flex: 1; }
  .blog-card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: .78rem; color: var(--muted); }
  .blog-back { display: inline-flex; align-items: center; gap: 6px; color: var(--rose); font-weight: 600; font-size: .88rem; margin-bottom: 16px; }
  .post-header { padding: 50px 0 30px; }
  .post-header h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.2; margin-bottom: 14px; }
  .post-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-bottom: 24px; }
  .post-content { font-size: 1.02rem; line-height: 1.85; color: #2e2a3a; max-width: 760px; margin: 0 auto; }
  .post-content h2 { font-size: 1.4rem; font-weight: 800; margin: 32px 0 14px; color: var(--ink); }
  .post-content h3 { font-size: 1.15rem; font-weight: 700; margin: 24px 0 10px; }
  .post-content p { margin-bottom: 16px; }
  .post-content ul, .post-content ol { margin: 16px 0 16px 24px; }
  .post-content li { margin-bottom: 8px; }
  .post-content img { border-radius: 16px; margin: 20px 0; width: 100%; }
  .post-content blockquote { border-left: 4px solid var(--rose); background: var(--rose-soft); padding: 14px 20px; border-radius: 10px; margin: 20px 0; font-style: italic; }
  .loading-screen, .empty-blog { text-align: center; padding: 80px 20px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a href="index.html" class="logo">
      <span class="logo-mark" style="display:flex; justify-content:center; align-items:center; gap:0px; font-size:1rem; padding: 0 4px; width: auto; min-width: 42px; background: #e8437c;">
        <span style="display:inline-block; transform:scaleX(-1);">🦢</span>
        <span>🦢</span>
      </span>
      <span class="logo-text">Evlenmek İsteyenler</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-ghost btn-sm">← Ana Sayfa</a>
    </div>
  </div>
</header>

<section class="blog-hero">
  <div class="container">
    <h1>📖 Blog & Tavsiyeler</h1>
    <p>Evlilik öncesi ve sonrası, ilişki tavsiyeleri, ilk buluşma ipuçları ve daha fazlası.</p>
  </div>
</section>

<section style="background:#fff; padding: 0;">
  <div class="container">
    <div id="blogList" class="blog-grid">
      <div class="loading-screen" style="grid-column:1/-1">⏳ Yazılar yükleniyor...</div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="foot-bottom" style="border-top:none;padding-top:0;justify-content:center">
      <span>© 2026 Evlenmek İsteyenler · Tüm hakları saklıdır.</span>
    </div>
  </div>
</footer>

<script>
const SUPABASE_URL = "https://mrlyghqqyvrdcwwmhpwj.supabase.co";
const SUPABASE_KEY = "sb_publishable_EW46ECy6Lv4Z1qJ_UPPx1A_JbU3G_rG";
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

async function loadBlogList() {
  const el = document.getElementById("blogList");
  const { data, error } = await db.from("blog_posts")
    .select("id, slug, title, excerpt, cover_image, category, created_at")
    .eq("is_published", true)
    .order("created_at", { ascending: false })
    .limit(50);

  if (error) { el.innerHTML = `<div class="empty-blog">Hata: ${esc(error.message)}</div>`; return; }
  if (!data || !data.length) {
    el.innerHTML = `<div class="empty-blog">Henüz yayınlanmış yazı yok.</div>`;
    return;
  }

  el.innerHTML = data.map(p => {
    const d = new Date(p.created_at);
    const dateStr = `${d.getDate()} ${["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][d.getMonth()]} ${d.getFullYear()}`;
    const cover = p.cover_image
      ? `<div class="cover" style="background-image:url('${esc(p.cover_image)}');background-size:cover;background-position:center;"></div>`
      : `<div class="cover">📖</div>`;
    return `<article class="blog-card" onclick="location.href='blog-post.html?slug=${encodeURIComponent(p.slug)}'">
      ${cover}
      <div class="body">
        <span class="cat">${esc(p.category || "tavsiye")}</span>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.excerpt || (p.title + "..."))}</p>
        <div class="foot">
          <span>📅 ${dateStr}</span>
          <span>Devamını oku →</span>
        </div>
      </div>
    </article>`;
  }).join("");
}

loadBlogList();
</script>
</body>
</html>
